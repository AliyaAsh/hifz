<title>Дневник хифза</title>
<meta name="description" content="Заучивание и повторение Корана по таблице: новое, ближнее и дальнее повторение, серия дней, напоминания.">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
:root{
  /* Layout: one phone-width column (max 560px), left-aligned; pastel gradient cards carry state; tab bar fixed to the bottom, the reader's microphone dock floats just above it */
  --paper:#FBF8FC;
  --sheet:#FFFFFF;
  --ink:#2D2541;
  --ink-2:#6B6383;
  --ink-3:#A29BB4;
  --rule:#E8E2F0;
  --rule-2:#F3EFF8;
  --accent:#7B68E0;
  --on-accent:#FFFFFF;
  --accent-soft:#EEEAFE;
  --accent-ink:#5B49C7;
  --wash-a:#FDE3EF;
  --wash-b:#E6E4FF;
  --g-dawn:linear-gradient(140deg,#FFE3D3 0%,#FAD4E4 48%,#DDD7FF 100%);
  --g-done:linear-gradient(140deg,#D3F5E4 0%,#D2EAFF 100%);
  --g-new:linear-gradient(140deg,#FFF3C4 0%,#FFE0CC 100%);
  --g-quran:linear-gradient(160deg,#E4EEFF 0%,#EFE6FF 58%,#FCE6F1 100%);
  --g-tile:linear-gradient(140deg,#E9E1FF 0%,#FBE2EE 100%);
  --new:#FFD66E; --new-soft:#FFF3CF; --amber:#EFAE45;
  --rev:#9BB2F6; --rev-ink:#3F5FC9; --rev-soft:#E6ECFE;
  --err:#F49AB2; --err-ink:#C0335F; --err-soft:#FDE1EA;
  --ok:#86D9B1; --ok-ink:#1E7F55; --ok-soft:#DDF5EA;
  --hint:#FFC98B; --hint-soft:#FFEEDB;
  --track:rgba(45,37,65,.09);
  --glass:rgba(255,255,255,.62);
  --hatch:rgba(255,255,255,.4);
  --shadow:0 12px 32px rgba(91,70,140,.14);
  --scrim:rgba(45,37,65,.32);
  --f-display:"Alegreya", Georgia, "Times New Roman", serif;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-ar:"Amiri Quran", "Amiri", "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16121E; --sheet:#221D2E; --ink:#F2EDF9; --ink-2:#B7AECA; --ink-3:#7F7794; --rule:#352E45; --rule-2:#2A2438;
    --accent:#A594FF; --on-accent:#1A1526; --accent-soft:#2E2752; --accent-ink:#C3B8FF;
    --wash-a:rgba(150,70,115,.20); --wash-b:rgba(95,95,200,.20);
    --g-dawn:linear-gradient(140deg,#4B3340 0%,#45304F 50%,#33315D 100%);
    --g-done:linear-gradient(140deg,#1F4A3A 0%,#213C5D 100%);
    --g-new:linear-gradient(140deg,#4C4224 0%,#4D3428 100%);
    --g-quran:linear-gradient(160deg,#232C48 0%,#2E2749 58%,#3A2638 100%);
    --g-tile:linear-gradient(140deg,#2F2752 0%,#432A41 100%);
    --new:#E5C15A; --new-soft:#3D3420; --amber:#E5B04F;
    --rev:#7F97E8; --rev-ink:#AFC0FF; --rev-soft:#25305A;
    --err:#E07A97; --err-ink:#FFA3BC; --err-soft:#4A2433;
    --ok:#4FBF8C; --ok-ink:#8BE3B9; --ok-soft:#1C3A2E;
    --hint:#D9A15C; --hint-soft:#43331F;
    --track:rgba(255,255,255,.12); --glass:rgba(255,255,255,.10); --hatch:rgba(255,255,255,.2);
    --shadow:0 12px 32px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16121E; --sheet:#221D2E; --ink:#F2EDF9; --ink-2:#B7AECA; --ink-3:#7F7794; --rule:#352E45; --rule-2:#2A2438;
  --accent:#A594FF; --on-accent:#1A1526; --accent-soft:#2E2752; --accent-ink:#C3B8FF;
  --wash-a:rgba(150,70,115,.20); --wash-b:rgba(95,95,200,.20);
  --g-dawn:linear-gradient(140deg,#4B3340 0%,#45304F 50%,#33315D 100%);
  --g-done:linear-gradient(140deg,#1F4A3A 0%,#213C5D 100%);
  --g-new:linear-gradient(140deg,#4C4224 0%,#4D3428 100%);
  --g-quran:linear-gradient(160deg,#232C48 0%,#2E2749 58%,#3A2638 100%);
  --g-tile:linear-gradient(140deg,#2F2752 0%,#432A41 100%);
  --new:#E5C15A; --new-soft:#3D3420; --amber:#E5B04F;
  --rev:#7F97E8; --rev-ink:#AFC0FF; --rev-soft:#25305A;
  --err:#E07A97; --err-ink:#FFA3BC; --err-soft:#4A2433;
  --ok:#4FBF8C; --ok-ink:#8BE3B9; --ok-soft:#1C3A2E;
  --hint:#D9A15C; --hint-soft:#43331F;
  --track:rgba(255,255,255,.12); --glass:rgba(255,255,255,.10); --hatch:rgba(255,255,255,.2);
  --shadow:0 12px 32px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background-color:var(--paper)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(900px 420px at 105% -8%,var(--wash-a) 0%,transparent 62%),radial-gradient(760px 420px at -12% -4%,var(--wash-b) 0%,transparent 58%);background-repeat:no-repeat;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:120px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
h1,h2,h3,p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;color:var(--ink-3);font-size:11px;font-weight:500;text-align:center}
.tab .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent-ink);font-weight:600}
.tab[aria-current="page"] .ic{background:var(--g-tile)}

/* headings */
.page-title{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1.05;letter-spacing:-.01em}
.h2{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15}
.h3{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* Today: dawn band */
.band{border-radius:28px;background:var(--g-dawn);padding:16px 18px 18px;display:flex;flex-direction:column;gap:18px;transition:background .6s}
.band.is-done{background:var(--g-done)}
.band-top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"mark dots" "date streak" "hijri hijri";column-gap:12px;align-items:end}
.brandmark{grid-area:mark;align-self:center;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2)}
.brandmark svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.band-top .dots{grid-area:dots;align-self:center}
.date{grid-area:date;font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;margin:16px 0 4px;letter-spacing:-.02em;white-space:nowrap}
.hijri{grid-area:hijri;font-family:var(--f-display);font-style:italic;font-size:16.5px;color:var(--ink-2)}
.streak{grid-area:streak;text-align:right;padding-bottom:6px}
.streak-n{font-family:var(--f-display);font-size:52px;line-height:.85;font-weight:700}
.streak-l{display:block;font-size:12.5px;color:var(--ink-2);margin-top:5px}
.dots{display:flex;gap:5px;justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:50%;border:1.6px solid var(--ink-3);display:block}
.dot.on{background:var(--ink);border-color:var(--ink)}
.dot.now{border-color:var(--ink)}
.band-prog{display:flex;flex-direction:column;gap:8px}
.band-prog .between{font-size:14px;font-weight:500}
.band-prog .between b{font-family:var(--f-display);font-size:20px;font-weight:700}
.band-bar{height:9px;border-radius:999px;background:var(--glass);overflow:hidden}
.band-bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .35s ease}
.band.is-done .band-bar i{background:var(--ok-ink)}

.demo-note{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:10px 14px;font-size:13px}
.demo-note button{font-weight:600;white-space:nowrap;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}

/* New: butter card with a mushaf ribbon */
.new-card{position:relative;background:var(--g-new);border-radius:26px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.ribbon{position:absolute;top:0;right:24px;width:18px;height:46px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.new-kicker{font-size:13px;font-weight:600;color:var(--ink-2);padding-right:40px}
.new-title{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;text-wrap:balance;padding-right:40px}
.new-pos{font-size:15px;font-weight:500}
.new-pos span{color:var(--ink-2);font-weight:400}
.meter{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--amber);transition:width .25s ease}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:16px;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-ink{background:var(--accent);color:var(--on-accent)}
.btn-line{border:1.5px solid var(--rule);background:var(--sheet)}
.btn-glass{background:var(--glass);color:var(--ink)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-wide{width:100%}
.btn-sq{width:44px;padding:0;font-size:20px;font-weight:500}
.today-note{font-size:13px;color:var(--ink-2)}

/* review list */
.rev-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.rev-count{font-size:14px;color:var(--ink-2)}
.rev-count b{color:var(--accent-ink);font-weight:700;font-size:17px}
.rev-group{margin-top:14px}
.rev-group .h3{display:flex;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1.5px solid var(--rule)}
.rev-group .h3 span{font-weight:400;color:var(--ink-3)}
.rev-item{display:flex;align-items:center;margin:0 -10px;border-bottom:1px solid var(--rule-2);border-radius:14px;transition:background .2s}
.rev-main{flex:1;min-width:0;display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:12px 6px 12px 10px}
.rev-read{flex:none;width:40px;height:40px;margin-right:4px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.rev-read svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rev-name{font-weight:500;min-width:0}
.rev-meta{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.rev-err{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;color:var(--err-ink);background:var(--err-soft);border-radius:999px;padding:1px 7px;vertical-align:1px}
.mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sheet);background:var(--sheet)}
.is-g{background:var(--rev-soft)}
.is-w{background:var(--err-soft)}
.is-g .mark{border-color:var(--rev-ink);background:var(--rev-ink)}
.is-w .mark{border-color:var(--err-ink);background:var(--err-ink)}
.is-g .rev-meta{color:var(--rev-ink);font-weight:600}
.is-w .rev-meta{color:var(--err-ink);font-weight:600}
.rev-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.empty{padding:16px 0;color:var(--ink-2)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:128px;padding:16px;border-radius:24px;background:var(--g-tile);text-align:left}
.tile.alt{background:var(--g-quran)}
.tile b{display:block;font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.1}
.tile span{font-size:12.5px;color:var(--ink-2)}
.tile-ar{font-family:var(--f-ar);font-size:34px;line-height:1;color:var(--accent-ink);align-self:flex-end}
.tile svg{width:30px;height:30px;stroke:var(--accent-ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;align-self:flex-end}

/* the ruled sheet */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:24px;height:12px;border-radius:6px;display:inline-block}
.sw-n{background:var(--new)}
.sw-g{background:var(--rev)}
.sw-w{background:var(--err)}
.grid-wrap{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;overflow:auto;max-height:calc(100dvh - 300px);min-height:280px;overscroll-behavior:contain}
.grid{border-collapse:separate;border-spacing:0;font-size:12px}
.grid th,.grid td{border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule);padding:0;background:var(--sheet)}
.grid thead th{position:sticky;top:0;z-index:2;vertical-align:bottom;height:142px;background:var(--rule-2);border-bottom:2px solid var(--accent)}
.grid .c-num,.grid .c-date{position:sticky;z-index:1}
.grid .c-num{left:0;width:30px;min-width:30px;text-align:center;color:var(--ink-3)}
.grid .c-date{left:30px;width:66px;min-width:66px;border-right:2px solid var(--accent)}
.grid thead .c-num,.grid thead .c-date{z-index:3}
.grid thead .c-date{text-align:left;padding:0 0 8px 6px;font-weight:600;color:var(--ink-2);vertical-align:bottom}
.grid .c-por{width:31px;min-width:31px}
.vh{display:block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:8px 0;margin:0 auto;font-weight:500;color:var(--ink);font-size:11.5px;max-height:136px;overflow:hidden;text-overflow:ellipsis}
.c-por.is-cur .vh{color:var(--accent-ink);font-weight:700}
.c-por.is-todo .vh{color:var(--ink-3);font-weight:400}
.grid tbody td{height:32px}
.daybtn{display:flex;flex-direction:column;justify-content:center;width:100%;height:32px;padding:0 6px;line-height:1.1}
.daybtn small{color:var(--ink-3);font-size:10.5px}
.cell{display:block;position:relative;width:100%;height:32px}
.mk{position:absolute;top:7px;bottom:7px;left:0;right:-1px;background-image:repeating-linear-gradient(-62deg,var(--hatch) 0 1.3px,transparent 1.3px 4.5px)}
.mk.a{left:3px;border-top-left-radius:9px;border-bottom-left-radius:9px}
.mk.z{right:3px;border-top-right-radius:9px;border-bottom-right-radius:9px}
.mk-g{background-color:var(--rev)}
.mk-w{background-color:var(--err)}
.mk-n{background-color:var(--new);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink)}
.grid tr.is-today td{background:var(--new-soft)}
.grid tr.is-today .c-date{font-weight:700}
.grid tr.sheet-break td{height:28px;background:var(--g-tile);border-bottom:0}
.sheet-label{position:sticky;left:8px;font-family:var(--f-display);font-style:italic;color:var(--accent-ink);font-size:14px;padding-left:8px}
.grid-name{font-family:var(--f-display);font-style:italic;font-size:19px;color:var(--accent-ink)}

/* progress */
.hero{border-radius:28px;background:var(--g-quran);padding:18px}
.hero-num{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-num b{font-family:var(--f-display);font-size:72px;line-height:.9;font-weight:700;letter-spacing:-.02em}
.hero-num span{font-size:16px;color:var(--ink-2)}
.hero-sub{margin-top:10px;color:var(--ink-2)}
.hero-sub strong{color:var(--ink);font-weight:600}
.juz{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
.jz{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:9px;background:var(--rule-2);overflow:hidden;display:grid;place-items:end center}
.jz i{position:absolute;left:0;right:0;bottom:0;background:var(--rev)}
.jz.full i{background:var(--ok)}
.jz span{position:relative;font-size:11px;font-weight:600;padding-bottom:3px;color:var(--ink-2)}
.jz.lit span{color:var(--ink)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:4px;margin-top:12px}
.hd{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:var(--rule-2)}
.hd.on{background:var(--rev)}
.hd.half{background:var(--rev-soft);box-shadow:inset 0 0 0 1.5px var(--rev)}
.hd.hd-n{box-shadow:inset 0 -4px 0 var(--new)}
.hd.now{outline:2px solid var(--accent);outline-offset:1px}
.hd.pad{visibility:hidden}
.stat-line{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px}
.stat-line div{display:flex;flex-direction:column}
.stat-line b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;color:var(--accent-ink)}
.stat-line span{font-size:12.5px;color:var(--ink-2)}
.fresh{display:flex;flex-direction:column;margin-top:6px}
.fr{display:grid;grid-template-columns:1fr 92px;gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule-2);width:100%}
.fr-name{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-bar{height:7px;border-radius:999px;background:var(--rule-2);overflow:hidden}
.fr-bar i{display:block;height:100%;background:var(--rev);border-radius:999px}
.fr-bar i.low{background:var(--new)}
.fr-bar i.weak{background:var(--err)}

<script>

const pid = parts => parts.map(x => `${x.s}:${x.f}-${x.t}`).join('+');
const mk = parts => ({ id: pid(parts), parts });
const pAyahs = p => p.parts.reduce((n, x) => n + x.t - x.f + 1, 0);

  const out = [], inGroup = {};

const pById = id => S.portions.find(p => p.id === id);

function learnOrder() {
  const arr = S.portions.slice();
  arr.sort(S.dir === 'end'
    ? (a, b) => pMax(b) - pMax(a) || a.parts[0].f - b.parts[0].f
    : byMushaf);
  return arr;
}
function partsLearn(p) { return S.dir === 'end' ? p.parts.slice().sort((a, b) => b.s - a.s || a.f - b.f) : p.parts; }
/* cumulative position l inside a portion -> readable label */
function posAt(p, l) {
  let rem = l;
  for (const x of partsLearn(p)) { const n = x.t - x.f + 1; if (rem <= n) return { s: x.s, a: x.f + rem - 1 }; rem -= n; }
  return null;
}
function posLabel(p, l) {
  if (!l || l <= 0) return 'ещё не начато';
  if (l >= pAyahs(p)) return 'выучено целиком';
  const at = posAt(p, l);
  return (p.parts.length > 1 ? NAMES[at.s] + ', ' : '') + `до ${at.a} аята`;
}
const currentPortion = () => learnOrder().find(p => !(S.memo[p.id] && S.memo[p.id].d)) || null;
const isDone = p => !!(S.memo[p.id] && S.memo[p.id].d);

function dayEntry(d, create) { let e = S.log[d]; if (!e && create) e = S.log[d] = { r: {} }; return e; }
function planIds(e) { if (!e || !e.plan) return []; return [...e.plan.near, ...e.plan.far, ...(e.x || [])].filter((v, i, a) => a.indexOf(v) === i && pById(v)); }
function dayDone(d) {
  const e = S.log[d]; if (!e) return false;
  const ids = planIds(e), r = e.r || {};
  if (ids.length) return ids.every(id => r[id]);
  return Object.keys(r).length > 0 || Object.keys(e.n || {}).length > 0;
}
function streakAt(d) { let n = 0; let x = dayDone(d) ? d : addDays(d, -1); while (dayDone(x)) { n++; x = addDays(x, -1); } return n; }
function bestStreak() {
  let best = 0, run = 0, prev = null;
  for (const d of Object.keys(S.log).sort()) { if (!dayDone(d)) continue; run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }

}
function revIndex(before) {
  const m = {};
  for (const d of Object.keys(S.log).sort()) { if (before && d >= before) break; const r = S.log[d].r || {}; for (const id in r) m[id] = { d, q: r[id] }; }
  return m;
}
const interval = q => q === 'w' ? Math.max(1, Math.ceil(S.cycle / 2)) : Math.max(1, S.cycle);

/* Daily review plan:
   near — the last N memorized portions plus the learned part of the current one, every day;
   far  — everything older, rotated so the whole lot comes round once per cycle;
          portions marked "с ошибками" come back twice as often. */
function buildPlan(date) {
  const done = learnOrder().filter(isDone);
  const nN = Math.min(S.near, done.length);
  const near = done.slice(done.length - nN).map(p => p.id);
  const cur = currentPortion();
  if (cur && (S.memo[cur.id] || {}).l > 0) near.push(cur.id);
  const farP = done.slice(0, done.length - nN);
  const rev = revIndex(date), C = Math.max(1, S.cycle);
  const load = farP.reduce((n, p) => n + pPages(p), 0) / C;
  const scored = farP.map((p, i) => {
    const r = rev[p.id], m = S.memo[p.id]; let since, q = 'g';
    if (r) { since = daysBetween(r.d, date); q = r.q; }
    else if (m.d && m.d !== 'pre') since = daysBetween(m.d, date);
    else since = C * (1 + (farP.length - i) / Math.max(1, farP.length));
    return { p, since, due: since / interval(q) };
  });
  scored.sort((a, b) => b.due - a.due || b.since - a.since);
  const far = []; let sum = 0;
  for (const x of scored) {
    const w = pPages(x.p);
    if (!far.length || sum + w / 2 <= load || (x.due >= 1 && sum + w <= 1.6 * load)) { far.push(x.p.id); sum += w; }
  }
  const ord = id => S.portions.findIndex(p => p.id === id);
  far.sort((a, b) => ord(a) - ord(b));
  return { near, far };
}
function ensurePlan(d) {
  const e = S.log[d];
  if (e && e.plan) return e;
  const plan = buildPlan(d);
  if (!plan.near.length && !plan.far.length) return e || null;
  const en = dayEntry(d, true); en.plan = plan; save();
  return en;
}
function setLearned(p, l, d) {
  const m = S.memo[p.id] || (S.memo[p.id] = { l: 0 });
  const tot = pAyahs(p); l = clamp(l, 0, tot);
  m.l = l;
  const e = dayEntry(d, true); e.n = e.n || {};
  if (l > 0) e.n[p.id] = l; else delete e.n[p.id];
  let finished = false;
  if (l >= tot && !m.d) { m.d = d; finished = true; }
  else if (l < tot && m.d === d) delete m.d;
  return finished;
}
function cycleMark(d, id) {
  const e = dayEntry(d, true); e.r = e.r || {};
  const v = e.r[id];
  if (!v) e.r[id] = 'g'; else if (v === 'g') e.r[id] = 'w'; else delete e.r[id];
  return e.r[id];
}
function learnedSet() {
  const L = new Uint8Array(TOTAL + 1);
  for (const p of S.portions) {
    const m = S.memo[p.id]; if (!m) continue;
    const n = m.d ? pAyahs(p) : (m.l || 0); let rem = n;
    for (const x of partsLearn(p)) { for (let a = x.f; a <= x.t && rem > 0; a++, rem--) L[G(x.s, a)] = 1; }
  }
  return L;
}

function makeDemo() {
  const st = fresh(); S = st; st.demo = true;
  const R = rng(20261027);
  const start = addDays(today(), -42);
  for (const p of S.portions) if (pMax(p) >= 87) S.memo[p.id] = { l: pAyahs(p), d: 'pre' };
  S.err = { '84:6:2': { n: 2, d: addDays(today(), -2) }, '85:9:1': { n: 1, d: addDays(today(), -4) }, '85:9:2': { n: 1, d: addDays(today(), -4) }, '86:7:0': { n: 1, d: addDays(today(), -6) }, '87:4:1': { n: 1, d: addDays(today(), -1) } };
  const skip = new Set([3, 11, 12, 24, 33].map(k => addDays(start, k)));
  for (let k = 0; k < 42; k++) {
    const d = addDays(start, k);
    if (skip.has(d)) continue;
    const e = ensurePlan(d) || dayEntry(d, true);
    for (const id of planIds(e)) e.r[id] = R() < 0.11 ? 'w' : 'g';
    const cur = currentPortion();
    if (cur && R() < 0.8) setLearned(cur, ((S.memo[cur.id] || {}).l || 0) + 1 + Math.floor(R() * 3), d);
  }
  S = st; save();
}

    const s = JSON.stringify(S), size = 3800, n = Math.ceil(s.length / size);

      const k = 's' + i; TG.CloudStorage.setItem(k, s.slice(i * size, (i + 1) * size), next); i++;

function cloudLoad(cb) {
  if (!hasCloud()) return cb(null);
  TG.CloudStorage.getItem('sn', (err, v) => {
    if (err || !v) return cb(null);
    const [n, u] = v.split('|').map(Number);
    if (S && S.u >= u) return cb(null);
    const keys = Array.from({ length: n }, (_, i) => 's' + i);
    TG.CloudStorage.getItems(keys, (e2, vals) => {
      if (e2 || !vals) return cb(null);

  /* 16-week calendar, columns are weeks starting Monday */
  const weeks = 16, dt = parseD(d0), dow = (dt.getDay() + 6) % 7;
  const first = addDays(d0, -(weeks - 1) * 7 - dow);
  let heat = '', active = 0;
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(first, i);
    if (d > d0) { heat += `<i class="hd pad"></i>`; continue; }
    const e = S.log[d], ok = dayDone(d), part = !ok && e && Object.keys(e.r || {}).length;
    if (ok) active++;
    heat += `<i class="hd${ok ? ' on' : part ? ' half' : ''}${e && e.n && Object.keys(e.n).length ? ' hd-n' : ''}${d === d0 ? ' now' : ''}" title="${fmt(parseD(d), { day: 'numeric', month: 'long' })}"></i>`;
  }
  /* memory freshness */
  const rev = revIndex();
  const fr = doneP.slice().reverse().map(p => {
    const r = rev[p.id], m = S.memo[p.id];
    const last = r ? r.d : (m.d !== 'pre' ? m.d : null);
    const since = last ? daysBetween(last, d0) : null, q = r ? r.q : 'g';
    const f = since === null ? 0 : clamp(1 - since / (interval(q) * 1.5), 0, 1);
    const cls = q === 'w' ? 'weak' : f < 0.35 ? 'low' : '';
    const meta = since === null ? 'ещё не повторялось в дневнике' : since === 0 ? 'повторено сегодня' : `повторено ${daysW(since)} назад`;
    return `<button class="fr" data-act="extra-one" data-id="${esc(p.id)}"><span class="fr-name">${esc(pTitle(p))}</span><span class="fr-bar"><i class="${cls}" style="width:${Math.max(4, f * 100).toFixed(0)}%"></i></span><span class="fr-meta">${meta}${q === 'w' ? ' · были ошибки' : ''}${since !== null && since >= interval(q) ? ' · пора повторить' : ''}</span></button>`;
  }).join('');
  const best = bestStreak(), st = streakAt(d0);
  const pgShown = nPg < 10 ? Math.round(nPg * 10) / 10 : Math.round(nPg);
  const ws = weakSpots().slice(0, 8);
  const wsHTML = ws.map(x => {
    const W = Q.ayat[x.s] ? words(x.s) : null;
    let ar = '';
    if (W) { const set = new Set(x.w); const parts = []; for (let k = W.start[x.a - 1]; k < W.start[x.a]; k++) parts.push(set.has(W.i[k]) ? `<mark>${esc(W.d[k])}</mark>` : esc(W.d[k])); ar = `<span class="wk-ar" lang="ar">${parts.join(' ')}</span>`; }
    return `<button class="wk" data-act="weak-open" data-s="${x.s}" data-a="${x.a}"><span class="wk-ref">${esc(NAMES[x.s])}, аят ${x.a}</span><span class="wk-n">${x.n} ${plural(x.n, 'ошибка', 'ошибки', 'ошибок')}</span>${ar}</button>`;
  }).join('');
  if (ws.length && ws.some(x => !Q.ayat[x.s])) quranInit().then(() => { if (Q.full && ui.tab === 'progress') render(); });
  return `<h1 class="page-title">Прогресс</h1>
  <section class="hero">
    <div class="hero-num"><b>${String(pgShown).replace('.', ',')}</b><span>${Number.isInteger(pgShown) ? plural(pgShown, 'страница', 'страницы', 'страниц') : 'страницы'} из 604</span></div>
    <p class="hero-sub"><strong>${ayahs(nAy)}</strong> · ${pct < 1 ? pct.toFixed(1).replace('.', ',') : Math.round(pct)} % Корана · ${doneP.length} ${plural(doneP.length, 'участок', 'участка', 'участков')} выучено</p>
  </section>
  <section><h2 class="h2">Джузы</h2><div class="juz">${juz}</div></section>
  <section><h2 class="h2">Дни повторения</h2>
    <div class="stat-line"><div><b>${st}</b><span>серия сейчас</span></div><div><b>${best}</b><span>лучшая серия</span></div><div><b>${active}</b><span>за 16 недель</span></div></div>
    <div class="heat" style="grid-template-columns:repeat(${weeks},minmax(0,1fr))">${heat}</div>
    <p class="hint">Голубой — повторение сделано, контур — начато, жёлтая черта — было новое.</p>

function remapIds(map) { /* map: oldId -> [newIds], merge rule for marks: 'w' wins */
  for (const d in S.log) {
    const e = S.log[d];
    for (const key of ['r', 'n']) {
      if (!e[key]) continue;
      const out = {};
      for (const id in e[key]) {
        const tgt = map[id] || [id];
        for (const t of tgt) {
          if (key === 'r') out[t] = (out[t] === 'w' || e[key][id] === 'w') ? 'w' : 'g';
          else out[t] = Math.max(out[t] || 0, e[key][id]);
        }
      }
      e[key] = out;
    }
    if (e.plan) for (const k of ['near', 'far']) e.plan[k] = [...new Set(e.plan[k].flatMap(id => map[id] || [id]))];
    if (e.x) e.x = [...new Set(e.x.flatMap(id => map[id] || [id]))];
  }
}
function normParts(parts) {
  const out = [];
  for (const x of parts) { const l = out[out.length - 1]; if (l && l.s === x.s && l.t + 1 === x.f) l.t = x.t; else out.push({ ...x }); }
  return out;
}
function mergeNext(id) {
  const i = S.portions.findIndex(p => p.id === id), a = S.portions[i], b = S.portions[i + 1];
  if (!a || !b) return;
  const np = mk(normParts([...a.parts, ...b.parts]));
  const ma = S.memo[a.id] || {}, mb = S.memo[b.id] || {};
  const la = ma.d ? pAyahs(a) : (ma.l || 0), lb = mb.d ? pAyahs(b) : (mb.l || 0);
  const m = { l: Math.min(pAyahs(np), la + lb) };
  if (ma.d && mb.d) m.d = (ma.d === 'pre' ? mb.d : mb.d === 'pre' ? ma.d : (ma.d > mb.d ? ma.d : mb.d));
  delete S.memo[a.id]; delete S.memo[b.id]; if (m.l || m.d) S.memo[np.id] = m;
  S.portions.splice(i, 2, np);
  remapIds({ [a.id]: [np.id], [b.id]: [np.id] });
}
function splitPortion(id) {
  const i = S.portions.findIndex(p => p.id === id), p = S.portions[i];
  if (!p) return;
  let kids;
  if (p.parts.length > 1) kids = p.parts.map(x => mk([x]));
  else {
    const x = p.parts[0]; if (x.t - x.f < 1) return;
    const target = PG[G(x.s, x.f) - 1] + pagesOf(x.s, x.f, x.t) / 2; let t = x.f;
    while (t < x.t - 1 && PG[G(x.s, t)] < target) t++;
    kids = [mk([{ s: x.s, f: x.f, t }]), mk([{ s: x.s, f: t + 1, t: x.t }])];
  }
  const m = S.memo[p.id] || {}; delete S.memo[p.id];
  S.portions.splice(i, 1, ...kids); S.portions.sort(byMushaf);
  if (m.d) kids.forEach(k => { S.memo[k.id] = { l: pAyahs(k), d: m.d }; });
  else if (m.l) {
    let rem = m.l;
    const ordered = S.dir === 'end' ? kids.slice().sort((a, b) => pMax(b) - pMax(a) || a.parts[0].f - b.parts[0].f) : kids;
    for (const k of ordered) { const n = Math.min(rem, pAyahs(k)); if (n > 0) S.memo[k.id] = n === pAyahs(k) ? { l: n, d: 'pre' } : { l: n }; rem -= n; }
  }
  remapIds({ [p.id]: kids.map(k => k.id) });
}

function quranInit() {

async function surahLoad(s) {

      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      d = { n: j.data.name, t: j.data.ayahs.map(x => x.text), p: j.data.ayahs.map(x => x.page || 0) };

  'd-del': el => openConfirm('Удалить день?', 'Все отметки этого дня пропадут из таблицы.', 'Удалить', 'do-del-day', el.dataset.d),

    openSheet('Добавить день', `<p class="muted">Для переноса бумажной таблицы: выберите дату, затем нажимайте на клетки.</p><label class="h3" for="nd">Дата</label><input id="nd" type="date" max="${today()}" value="${addDays(today(), -1)}">`,
      `<button class="btn btn-ink" data-act="add-day-ok">Добавить</button>`, 'addday');
  },
  'add-day-ok': () => {
    const v = $('#nd').value; if (!v) return;
    dayEntry(v, true).m = 1;
    save(); ui.gridPos = null; closeSheet(); toast('День добавлен — отметьте клетки');
  },
  near: el => { S.near = clamp(S.near + Number(el.dataset.v), 0, 20); afterPlanSetting(); },
  cycle: el => { S.cycle = clamp(S.cycle + Number(el.dataset.v), 1, 60); afterPlanSetting(); },
  dir: el => { S.dir = el.dataset.v; afterPlanSetting(); },
  portions: () => openSheet('Участки', portionsSheet(), '', 'portions'),
  'p-toggle': el => {
    const p = pById(el.dataset.id); if (!p) return;
    const m = S.memo[p.id];
    if (m && m.d) { delete m.d; m.l = 0; delete S.memo[p.id]; } else S.memo[p.id] = { l: pAyahs(p), d: 'pre' };
    save(); updateSheet(portionsSheet());
  },
  'p-menu': el => {
    const id = el.dataset.id, p = pById(id); if (!p) return;
    const i = S.portions.findIndex(x => x.id === id), nx = S.portions[i + 1];
    const canSplit = p.parts.length > 1 || p.parts[0].t > p.parts[0].f;
    openSheet(pTitle(p), `<div class="menu">
      ${nx ? `<button data-act="p-merge" data-id="${esc(id)}">Объединить со следующим: ${esc(pTitle(nx))}</button>` : ''}
      ${canSplit ? `<button data-act="p-split" data-id="${esc(id)}">${p.parts.length > 1 ? 'Разделить на отдельные суры' : 'Разделить пополам'}</button>` : ''}
      <button data-act="portions">Назад к списку</button></div>`, '', 'pmenu');
  },
  'p-merge': el => { mergeNext(el.dataset.id); save(); openSheet('Участки', portionsSheet(), '', 'portions'); toast('Участки объединены'); },
  'p-split': el => { splitPortion(el.dataset.id); save(); openSheet('Участки', portionsSheet(), '', 'portions'); toast('Участок разделён'); },
  backup: () => {
    openSheet('Резервная копия', `<p class="muted">Скопируйте текст и сохраните, например, в «Избранное» в Telegram. Чтобы восстановить, вставьте его сюда и нажмите «Восстановить».</p>
      <textarea id="bk" spellcheck="false">${esc(JSON.stringify(S))}</textarea>`,
      `<button class="btn btn-line" data-act="bk-in">Восстановить</button><button class="btn btn-ink" data-act="bk-copy">Скопировать</button>`, 'backup');
  },
  'bk-copy': () => {
    const t = $('#bk');
    const done = () => toast('Скопировано');
    const fallback = () => { t.focus(); t.select(); toast('Текст выделен — скопируйте его'); };
    if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(done, fallback); else fallback();
  },
  'bk-in': () => {
    try {
      const o = JSON.parse($('#bk').value);
      if (!o || !Array.isArray(o.portions) || typeof o.log !== 'object') throw new Error('bad');
      S = o; save(); closeSheet(); toast('Дневник восстановлен');
    } catch (e) { toast('Это не похоже на копию дневника — проверьте текст'); }
  },
  'ask-demo': () => openConfirm('Показать пример?', 'Ваш дневник заменится примером. Сначала сохраните резервную копию, если в нём есть отметки.', 'Показать пример', 'do-demo'),
  'ask-reset': () => openConfirm('Начать заново?', 'Все отметки и выученное удалятся из дневника.', 'Удалить всё', 'do-reset'),
  'do-demo': () => { makeDemo(); closeSheet(); go('today'); toast('Загружен пример'); },
  'do-reset': () => { S = null; try { localStorage.removeItem(LS); } catch (e) { /* noop */ } ui.sheet = null; ui.tab = 'today'; openOnboarding(); render(); },
  'do-del-day': el => { delete S.log[el.dataset.arg]; save(); closeSheet(); toast('День удалён'); },
  /* Quran */
  'open-quran': () => { ui.q.mode = 'hide'; S.qmode = 'hide'; ui.peek = null; openReader(ui.q.s || (currentPortion() || { parts: [{ s: 1 }] }).parts[0].s, null, null); },
  'read-portion': el => { const p = pById(el.dataset.id); if (p) openReader(p.parts[0].s, p.parts[0].f, p.id); },
  'weak-open': el => openReader(Number(el.dataset.s), Number(el.dataset.a), null),
  'q-go': el => { const sN = Number(el.dataset.v); ui.sheet = null; $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); $('#sheet').hidden = true; $('#scrim').hidden = true; try { if (TG) TG.BackButton.hide(); } catch (e) { /* noop */ } openReader(sN, null, null); },
  'q-pick': () => openSheet('Суры', `<div class="pick-search"><input id="sr-q" type="search" placeholder="Название или номер" autocomplete="off" data-act="sr-q"></div><div id="sr-list" class="pick">${surahPicker('')}</div>`, '', 'surahs'),
  'q-mode': el => { ui.q.mode = el.dataset.v; S.qmode = ui.q.mode; ui.peek = null; save(); render(); },
  'q-size': el => { S.qsize = clamp((S.qsize || 30) + Number(el.dataset.v), 20, 46); save(); const b = document.querySelector('.q-body'); if (b) b.style.setProperty('--qsize', S.qsize + 'px'); },
  'q-retry': () => { ui.q.loadErr = null; render(); },
  qw: el => {
    const ref = Number(el.dataset.r), k = errKey(ref); if (!k) return;
    S.err = S.err || {};
    if (ui.q.mode === 'hide' && !el.classList.contains('peek')) { ui.peek = ui.peek || new Set(); ui.peek.add(ref); el.classList.add('peek'); return; }
    if (S.err[k]) { delete S.err[k]; el.classList.remove('saved'); toast('Отметка снята'); }
    else { S.err[k] = { n: 1, d: today() }; el.classList.add('saved'); toast('Слово отмечено как ошибка'); }
    save(); haptic();
  },
  'q-ayah': el => ayahSheet(Number(el.dataset.s), Number(el.dataset.a)),
  'q-listen': el => {
    const g = G(Number(el.dataset.s), Number(el.dataset.a));
    stopAudio(); closeSheet(true);
    audio = new Audio(`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${g}.mp3`);
    audio.onended = () => { audio = null; };
    audio.play().catch(() => { audio = null; toast('Не удалось включить аудио — нужен интернет'); });
  },
  'q-reveal': el => { const sN = +el.dataset.s, a = +el.dataset.a, W = words(sN); ui.peek = ui.peek || new Set(); for (let k = W.start[a - 1]; k < W.start[a]; k++) ui.peek.add(REF(sN, k)); closeSheet(); },
  'q-unmark': el => { const pre = el.dataset.s + ':' + el.dataset.a + ':'; for (const k of Object.keys(S.err || {})) if (k.startsWith(pre)) delete S.err[k]; save(); closeSheet(); toast('Отметки сняты'); },
  'q-focus-done': () => {
    const id = ui.q.focus, p = id && pById(id); if (!p) return;
    const d = today(), e = ensurePlan(d) || dayEntry(d, true); e.r = e.r || {}; if (!e.plan) e.plan = { near: [], far: [] };
    if (!planIds(e).includes(id)) e.x = (e.x || []).concat(id);
    const bad = errsToday(p);
    e.r[id] = bad ? 'w' : 'g'; save();
    toast(`${pTitle(p)} — ${bad ? 'с ошибками' : 'повторено'}`); ui.q.focus = null; render();
  },
  'err-clear-ask': () => openConfirm('Очистить слабые места?', 'Все отметки ошибок в тексте Корана удалятся.', 'Очистить', 'err-clear'),
  'err-clear': () => { S.err = {}; save(); closeSheet(); toast('Отметки ошибок очищены'); },
  /* onboarding */
  'onb-demo': () => { makeDemo(); ui.onb = null; closeSheet(); render(); },
  'onb-next': () => { ui.onb.step++; onbStep(); $('#sheet-body').scrollTop = 0; },
  'onb-back': () => { ui.onb.step--; onbStep(); },
  'onb-dir': el => { ui.onb.st.dir = el.dataset.v; ui.onb.st.memo = {}; onbStep(); },
  'onb-upto': el => {
    const o = ui.onb, prev = S; S = o.st;
    const order = learnOrder(), i = Number(el.dataset.i);
    const lastDone = order.reduce((k, p, j) => isDone(p) ? j : k, -1);
    S.memo = {};
    const upto = (i === lastDone) ? i - 1 : i;
    for (let j = 0; j <= upto; j++) S.memo[order[j].id] = { l: pAyahs(order[j]), d: 'pre' };
    S = prev;
    const y = $('#sheet-body').scrollTop; onbStep(); $('#sheet-body').scrollTop = y;
  },
  'onb-more': () => { ui.onb.all = true; const y = $('#sheet-body').scrollTop; onbStep(); $('#sheet-body').scrollTop = y; },
  'onb-cycle': el => { ui.onb.st.cycle = Number(el.dataset.v); onbStep(); },
  'onb-finish': () => { S = ui.onb.st; ui.onb = null; save(); closeSheet(); }
};
function updateFoot(html) { const f = $('#sheet-foot'); f.innerHTML = html; f.hidden = !html; }
function openConfirm(title, text, okLabel, act, arg) {
  openSheet(title, `<p class="lead" style="font-size:15px">${esc(text)}</p>`,
    `<button class="btn btn-line" data-act="close-sheet">Отмена</button><button class="btn btn-ink" data-act="${act}" ${arg ? `data-arg="${esc(arg)}"` : ''}>${esc(okLabel)}</button>`, 'confirm');
}
function afterPlanSetting() {
  const e = S.log[today()];
  if (e && e.plan && !Object.keys(e.r || {}).length) delete e.plan;
  save(); render();
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const fn = ACT[el.dataset.act];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', ev => {
  const el = ev.target, a = el.dataset && el.dataset.act;
  if (a === 'name') { S.name = el.value.trim().slice(0, 40); save(); }
  if (a === 'd-por') {
    const d = ui.dayD, e = dayEntry(d, true), id = el.value;
    e.n = {};
    if (id) { const p = pById(id); const l = Math.max(1, (S.memo[id] || {}).l || 1); e.n[id] = l; if (!S.memo[id]) S.memo[id] = { l }; }
    save(); updateSheet(daySheet(d));
  }
  if (a === 'd-pos') applyDayPos(el, true);
});
document.addEventListener('input', ev => {
  if (ev.target.dataset && ev.target.dataset.act === 'd-pos') applyDayPos(ev.target, false);
  if (ev.target.dataset && ev.target.dataset.act === 'sr-q') { const L = document.getElementById('sr-list'); if (L) L.innerHTML = surahPicker(ev.target.value); }
});
function applyDayPos(el, commit) {
  const d = ui.dayD, e = S.log[d]; if (!e || !e.n) return;
  const id = Object.keys(e.n)[0], p = pById(id); if (!p) return;
  const l = Number(el.value);
  $('#d-pos-l').textContent = posLabel(p, l);
  if (commit) {
    e.n[id] = l;
    const m = S.memo[id] || (S.memo[id] = { l: 0 });
    const latest = Object.keys(S.log).filter(x => S.log[x].n && S.log[x].n[id]).sort().pop();
    if (latest === d) { m.l = l; if (l >= pAyahs(p)) m.d = m.d || d; else if (m.d === d) delete m.d; }
    save();
  }
}
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });

/* ================= boot ================= */
initTelegram(() => {
  S = loadLocal();
  if (S) { render(); } else { render(); openOnboarding(); }
  cloudLoad(obj => {
    if (obj && obj.portions) {
      S = obj;
      try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* noop */ }
      if (ui.sheet === 'onb') { ui.onb = null; closeSheet(); } else render();
    }
  });
});
window.__hifz = { get S() { return S; }, set S(v) { S = v; }, ui, Q, nkey, words, openReader, refInfo, buildPlan, learnOrder, defaultPortions, pAyahs, pPages, pTitle, posLabel, dayDone, streakAt, makeDemo, mergeNext, splitPortion, render, TOTAL, PG, JUZG, AY, go };
})();
</script>
</body>
</html>
